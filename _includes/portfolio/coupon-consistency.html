<figure class="structure" data-diagram="coupon-consistency">
  <figcaption>선착순 쿠폰 발급 구조의 변화 · 판정과 기록의 위치</figcaption>
  <div class="diagram-grid">
    <div class="diagram-side before">
      <div class="diagram-label">BEFORE <span>응답 전에 MySQL이 재고 행을 잠그고 판정</span></div>
      <div class="flow"><div class="node">신청</div><span class="arrow" aria-hidden="true">→</span><div class="node risk">MySQL<small>재고 행 잠금 → 차감 → 기록</small></div><span class="arrow" aria-hidden="true">→</span><div class="node">응답</div></div>
      <p class="flow-caption">잠금 없이는 <strong>107장 발급</strong>, 잠그면 <strong>656rps에서 정체</strong> · DB가 멈추면 신청도 멈춤</p>
    </div>
    <div class="diagram-side after">
      <div class="diagram-label">AFTER <span>RabbitMQ 접수 + MySQL 단일 판정</span></div>
      <div class="flow"><div class="node">신청</div><span class="arrow" aria-hidden="true">→</span><div class="node good">RabbitMQ<small>저장 확인</small></div><span class="arrow" aria-hidden="true">→</span><div class="node">202 접수 번호</div></div>
      <div class="down" aria-hidden="true">↓</div>
      <div class="scope"><span class="scope-label">응답 뒤 · 소비자 1개가 순서대로</span><div class="flow"><div class="node good">MySQL 트랜잭션<small>중복 확인 → 재고 차감 → 결과 기록</small></div><span class="arrow" aria-hidden="true">→</span><div class="node">커밋 후 ACK</div></div></div>
      <p class="flow-caption"><strong>UNIQUE · 조건부 차감</strong> · 대가: 결과 확인까지 지연</p>
    </div>
  </div>
</figure>
