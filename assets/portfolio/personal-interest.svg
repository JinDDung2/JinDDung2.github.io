<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title"><title id="title">개인별 세후 이자 비교 흐름</title><rect width="1000" height="560" fill="#f7f8f9"/>
<g font-family="-apple-system, BlinkMacSystemFont, sans-serif" text-anchor="middle">
<text x="500" y="60" font-size="26" font-weight="600" fill="#252a2c">개인별 세후 이자 비교 흐름</text>
<text x="260" y="115" font-size="20" fill="#22695c">개인별 적용금리</text>
<rect x="35" y="145" width="450" height="72" rx="5" fill="#edf5f1" stroke="#bacdc8"/><text x="260" y="189" font-size="22" fill="#252a2c">만기 · 적립 방식 선택</text>
<text x="260" y="243" font-size="23" fill="#626b70">↓</text>
<rect x="35" y="250" width="450" height="72" rx="5" fill="#edf5f1" stroke="#bacdc8"/><text x="260" y="294" font-size="22" fill="#252a2c">충족 조건만 정수 bp 합산</text>
<text x="260" y="348" font-size="23" fill="#626b70">↓</text>
<rect x="35" y="355" width="450" height="72" rx="5" fill="#edf5f1" stroke="#bacdc8"/><text x="260" y="399" font-size="22" fill="#252a2c">공시 최고금리 상한 적용</text>
<text x="260" y="485" font-size="17" fill="#626b70">OTHER · 0bp · 미해석 우대폭은 합산 제외</text>
<text x="740" y="115" font-size="20" fill="#22695c">세후 이자 비교</text>
<rect x="515" y="145" width="450" height="72" rx="5" fill="#edf5f1" stroke="#bacdc8"/><text x="740" y="189" font-size="22" fill="#252a2c">단리 또는 월복리 계산</text>
<text x="740" y="243" font-size="23" fill="#626b70">↓</text>
<rect x="515" y="250" width="450" height="72" rx="5" fill="#edf5f1" stroke="#bacdc8"/><text x="740" y="294" font-size="22" fill="#252a2c">세전 이자 반올림 · 세금 절사</text>
<text x="740" y="348" font-size="23" fill="#626b70">↓</text>
<rect x="515" y="355" width="450" height="72" rx="5" fill="#edf5f1" stroke="#bacdc8"/><text x="740" y="399" font-size="22" fill="#252a2c">세후 이자 기준 정렬</text>
<text x="740" y="485" font-size="17" fill="#626b70">같은 이자는 기본금리 · 상품 코드 순으로 정렬</text>
</g></svg>
